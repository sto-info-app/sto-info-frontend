name: 'Quality: Lighthouse'

on:
  pull_request:
    branches:
      - development
      - production
    types: [opened, synchronize, reopened, ready_for_review]

  schedule:
    # Weekly audit every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src_changed: ${{ steps.filter.outputs.src_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        id: filter
        with:
          filters: |
            src_changed:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'angular.json'
              - 'tsconfig.json'
              - 'tsconfig.*.json'
              - 'eslint.config.mjs'
              - 'jest.config.cjs'
              - 'stryker.config.json'
              - 'setup-jest.ts'
              - 'sonar-project.properties'
              - '.lighthouserc.json'
              - '.prettierrc'

  lighthouse:
    name: 'Lighthouse Audit'
    needs: check_changes
    # Skip if no relevant changes (unless scheduled or manual)
    if: |
      needs.check_changes.outputs.src_changed == 'true' || 
      github.event_name == 'schedule' || 
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: ${{ steps.cache-toggle.outputs.use_cache }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Create production environment.ts
        run: |
          mkdir -p src/environments
          cat << 'EOF' > src/environments/environment.ts
          import packageJson from '../../package.json';
          import type { Environment } from './models/environment.model';

          export const environment: Environment = {
            production: true,
            version: packageJson.version,
            env_name: 'lighthouse-audit',
            env_label: 'Lighthouse Audit',
            apiUrl: 'https://dev-api.startrekonline.info',
            appTitle: 'STO Info (Lighthouse)',
            appLoggedInHome: '/dashboard',
            allowDebugging: false,
            minsBeforeLogoutExpiryToShowWarning: 5,
            minsBeforeLogoutExpiryToRefreshToken: 2,
            cookieYesUrl: 'https://cdn-cookieyes.com/client_data/test/script.js',
            gaMeasurementId: 'G-XXXXXXX',
            logRocketAppId: 'test/appid',
          };
          EOF

      - name: Build Angular application
        run: npm run build:prod

      - name: Run Lighthouse Audit
        run: npm run lint:lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Summarize Lighthouse Results
        if: always()
        run: npm run summary:ci
        env:
          CI_SUMMARY_FILE: lhci-summary.md

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@d17ab6ee39f3224f573468f6426f351e409b1000 # v3.2.0.8.3.2.0
        with:
          message-path: lhci-summary.md
          allow-repeats: true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
          retention-days: 30
