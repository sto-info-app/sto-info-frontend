name: Merge to Development CI/CD

on:
  push:
    branches:
      - development

env:
  NODE_VERSION: 18

jobs:
  build_and_deploy_dev_to_aws:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}
          fontawesome-npm-auth-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies

      - name: Build website
        run: npm run build

      - name: Upload artifacts
        id: upload_step
        uses: actions/upload-artifact@v3
        with:
          name: dist-files
          path: dist

      - name: Check upload success
        run: |
          if [[ "${{ steps.upload_step.outcome }}" != "success" ]]; then
            echo "Upload step failed."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Sync dist folder to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          AWS_S3_BUCKET: dev.startrekonline.info
          SOURCE_DIR: 'dist/sto-info-frontend'
          ACL: 'public-read'
          ARGS: '--delete'
