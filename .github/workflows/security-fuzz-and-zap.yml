name: 'Security: Fuzz + ZAP'

on:
  pull_request:
    branches:
      - development
    types: [opened, synchronize, reopened, ready_for_review]

  schedule:
    # Weekly full scan every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

  workflow_dispatch:
    inputs:
      fuzz_run_count:
        description: 'Number of fuzz test runs (default: 100 for PR, 1000 for weekly)'
        required: false
        default: '1000'
      zap_scan_type:
        description: 'ZAP scan type (baseline or full)'
        required: false
        default: 'full'

permissions: {}

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: 'Property-based fuzz testing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        if: steps.cache-toggle.outputs.use_cache == 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Create test environment.ts
        run: |
          mkdir -p src/environments
          cat << 'EOF' > src/environments/environment.ts
          import packageJson from '../../package.json';
          import type { Environment } from './models/environment.model';

          export const environment: Environment = {
            production: false,
            version: packageJson.version,
            env_name: 'ci',
            env_label: 'CI',
            apiUrl: 'http://localhost:3000',
            appTitle: 'STO Info (CI)',
            appLoggedInHome: '/dashboard',
            allowDebugging: false,
            minsBeforeLogoutExpiryToShowWarning: 5,
            minsBeforeLogoutExpiryToRefreshToken: 2,
            cookieYesUrl: 'https://cdn-cookieyes.com/client_data/test/script.js',
            gaMeasurementId: 'G-XXXXXXX',
            logRocketAppId: 'test/appid',
          };
          EOF

      - name: Run lightweight fuzz tests (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:fuzz
        env:
          FUZZ_NUM_RUNS: 50

      - name: Run deep fuzz tests (weekly/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:fuzz:full
        env:
          FUZZ_NUM_RUNS: ${{ github.event.inputs.fuzz_run_count || '1000' }}

  zap:
    name: 'OWASP ZAP DAST scan'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        if: steps.cache-toggle.outputs.use_cache == 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Create production environment.ts
        run: |
          mkdir -p src/environments
          cat << 'EOF' > src/environments/environment.ts
          import packageJson from '../../package.json';
          import type { Environment } from './models/environment.model';

          export const environment: Environment = {
            production: true,
            version: packageJson.version,
            env_name: 'zap-test',
            env_label: 'ZAP Test',
            apiUrl: 'http://localhost:3000',
            appTitle: 'STO Info (ZAP)',
            appLoggedInHome: '/dashboard',
            allowDebugging: false,
            minsBeforeLogoutExpiryToShowWarning: 5,
            minsBeforeLogoutExpiryToRefreshToken: 2,
            cookieYesUrl: 'https://cdn-cookieyes.com/client_data/test/script.js',
            gaMeasurementId: 'G-XXXXXXX',
            logRocketAppId: 'test/appid',
          };
          EOF

      - name: Build Angular application
        run: npm run build:prod

      - name: Locate dist folder containing index.html
        id: locate-dist
        run: |
          # Find the directory containing index.html within dist/
          DIST_DIR=$(find dist -name "index.html" -type f -printf '%h\n' | head -n 1)
          if [ -z "$DIST_DIR" ]; then
            echo "Error: Could not find index.html in dist/"
            exit 1
          fi
          echo "dist_path=$DIST_DIR" >> "$GITHUB_OUTPUT"
          echo "Found dist folder: $DIST_DIR"

      - name: Start local web server
        run: |
          npx --yes serve@14.2.4 -s "${{ steps.locate-dist.outputs.dist_path }}" -l 4200 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "Started server with PID: $SERVER_PID"

          # Wait for server to be ready (max 60 seconds)
          timeout=60
          counter=0
          until curl -sf http://localhost:4200 > /dev/null 2>&1; do
            if [ $counter -ge $timeout ]; then
              echo "Server failed to start within ${timeout}s"
              exit 1
            fi
            echo "Waiting for server to start... ($counter/$timeout)"
            sleep 2
            counter=$((counter + 2))
          done
          echo "Server is ready at http://localhost:4200"

      - name: Run ZAP baseline scan (PR)
        if: github.event_name == 'pull_request'
        uses: zaproxy/action-baseline@fcad600881c0eb1a1e1c1eb3ab1e46bfe0ef4bb8 # v0.15.0
        with:
          target: 'http://localhost:4200'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -m 3 -T 600'
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      - name: Run ZAP full scan (weekly/manual)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.zap_scan_type == 'full')
        uses: zaproxy/action-full-scan@fcad600881c0eb1a1e1c1eb3ab1e46bfe0ef4bb8 # v0.15.0
        with:
          target: 'http://localhost:4200'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -m 3 -T 1800'
          allow_issue_writing: false
          artifact_name: 'zap-full-scan-report'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea0331d7338ce0df01d8c6ca6eacc5e8ea4cf733 # v6.0.1
        with:
          name: zap-scan-report-${{ github.event_name }}
          path: |
            zap-baseline-report/**
            zap-full-scan-report/**
          retention-days: 30

      - name: Cleanup server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
