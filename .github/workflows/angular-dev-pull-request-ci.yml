name: Development Pull Request CI

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

env:
  NODE_VERSION: 18

jobs:
  lint_and_test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}
          fontawesome-npm-auth-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies

      - name: Lint code
        id: lint_step
        run: npm run lint || echo "::set-output name=status::failure"

      - name: Test code
        id: test_step
        run: npm run test || echo "::set-output name=status::failure"

      - name: Check results
        run: |
          if [[ "${{ steps.lint_step.outputs.status }}" == "failure" ]] || [[ "${{ steps.test_step.outputs.status }}" == "failure" ]]; then
            echo "Lint or Test step failed."
            exit 1
          fi

  version_bump:
    if: github.actor != 'github-actions[bot]' && !endsWith(github.event.head_commit.message, '[no version bump]') && needs.lint_and_test.result == 'success'
    needs: lint_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Bump version (patch)
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GH_PAT_REPO_TOKEN }}
          default_bump: patch
          tag_prefix: v
          # create_annotated_tag: false # do not create a tag yet
