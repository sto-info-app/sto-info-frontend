name: Development Pull Request CI

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

env:
  NODE_VERSION: 18

jobs:
  lint_and_test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}
          fontawesome-npm-auth-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies

      - name: Lint code
        id: lint_step
        run: npm run lint || echo "::set-output name=status::failure"

      - name: Test code
        id: test_step
        run: npm run test || echo "::set-output name=status::failure"

      - name: Check results
        run: |
          if [[ "${{ steps.lint_step.outputs.status }}" == "failure" ]] || [[ "${{ steps.test_step.outputs.status }}" == "failure" ]]; then
            echo "Lint or Test step failed."
            exit 1
          fi

  version_bump:
    if: github.actor != 'github-actions[bot]' && !endsWith(github.event.head_commit.message, '[no version bump]') && needs.lint_and_test.result == 'success'
    needs: lint_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get current version
        id: current_version
        run: echo "::set-output name=version::$(node -p "require('./package.json').version")"

      - name: Bump version (patch) in package.json
        id: bump_version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm version patch -m "Bump version to %s"
          echo "::set-output name=new_version::$(node -p "require('./package.json').version")"

      - name: Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git push

      - name: Check version bump
        run: |
          if [[ "${{ steps.current_version.outputs.version }}" == "${{ steps.bump_version.outputs.new_version }}" ]]; then
            echo "Version bump failed."
            exit 1
          fi

      - name: Bump version (patch) in Git
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GH_PAT_REPO_TOKEN }}
          default_bump: false
          tag_prefix: v
          release_branches: development
          # create_annotated_tag: false # do not create a tag yet
