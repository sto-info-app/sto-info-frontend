name: Mutation Testing (Full)

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Allow manual trigger

# Declare default permissions as none.
permissions: {}

env:
  NODE_VERSION: 24.21.0

jobs:
  stryker_full:
    name: Full Mutation Analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # This run has been creeping towards its budget for months (89m, 75m, 120m,
    # 121m, 118m) and was cancelled at the 180 minute mark on 2026-08-30. Full
    # analysis then started OOMing the dry run (~12k mutants) at concurrency 4.
    # --concurrency 2 (1 checker + 1 test runner) plus an 8GB worker heap is
    # what lets that dry run fit on a 16GB ubuntu-latest runner; it is slower
    # than concurrency 4, so this budget stays high so a slow week is a slow
    # run rather than a lost one.
    timeout-minutes: 480
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: true
          node-version: ${{ env.NODE_VERSION }}

      - name: Create test environment.ts
        run: |
          mkdir -p src/environments
          cat << 'EOF' > src/environments/environment.ts
          import packageJson from '../../package.json';
          import type { Environment } from './models/environment.model';

          export const environment: Environment = {
            production: false,
            version: packageJson.version,
            env_name: 'ci',
            env_label: 'CI',
            apiUrl: 'http://localhost:3000',
            appTitle: 'STO Info (CI)',
            appLoggedInHome: '/dashboard',
            allowDebugging: false,
            minsBeforeLogoutExpiryToShowWarning: 5,
            minsBeforeLogoutExpiryToRefreshToken: 2,
            cookieYesUrl: 'https://cdn-cookieyes.com/client_data/test/script.js',
            gaMeasurementId: 'G-XXXXXXX',
            logRocketAppId: 'test/appid',
          };
          EOF

      - name: Run Stryker (Full)
        # concurrency 2 => 1 TypeScript checker + 1 test runner, so the dry run
        # does not start two instrumented Jest processes on a 16GB runner.
        # NODE_OPTIONS raises the parent Stryker process; testRunnerNodeArgs in
        # stryker.config.json raises the child workers to the same 8GB ceiling.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx stryker run --concurrency 2

      - name: Upload Mutation Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-full-report
          path: reports/mutation/
          retention-days: 30
