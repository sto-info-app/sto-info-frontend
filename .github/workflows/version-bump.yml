name: Version Bump

on:
  workflow_dispatch:

  # Check pull request (issue) comment when it is created
  issue_comment:
    types: [created]

env:
  BUMP_VERSION_COMMIT_MSG: 'Bump version number'

jobs:
  prerequisite_check:
    # Run for manual dispatch, or when commenting on a PR
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.commit.outputs.skip }}
      branch: ${{ steps.get_branch_name.outputs.branch }}
      do_version_bump: ${{ steps.check_comment.outputs.do_version_bump }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: commit
        name: Get commit message
        run: |
          COMMIT_MESSAGE=$(git log --no-merges -1 --format=%B)
          echo "Current commit message: $COMMIT_MESSAGE"
          if [[ "$COMMIT_MESSAGE" == "${{ env.BUMP_VERSION_COMMIT_MSG }}"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - id: get_branch_name
        name: Get branch name
        run: |
          if [ -n "${GITHUB_HEAD_REF}" ]; then
            branch_name=${GITHUB_HEAD_REF}
          else
            branch_name=${GITHUB_REF#refs/heads/}
          fi
          echo "Branch name is: $branch_name"
          echo "branch=$branch_name" >> "$GITHUB_OUTPUT"
        shell: bash

      - id: check_comment
        name: Check for /bump_version comment
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch detected; forcing version bump."
            echo "do_version_bump=true" >> "$GITHUB_OUTPUT"
          else
            COMMENT_BODY="${{ github.event.comment.body }}"
            if [[ "$COMMENT_BODY" == *"/bump_version"* ]]; then
              echo "do_version_bump=true" >> "$GITHUB_OUTPUT"
            else
              echo "do_version_bump=false" >> "$GITHUB_OUTPUT"
            fi
          fi
        shell: bash

      - name: Print Outputs
        run: |
          echo "skip: ${{ steps.commit.outputs.skip }}"
          echo "branch: ${{ steps.get_branch_name.outputs.branch }}"
          echo "do_version_bump: ${{ steps.check_comment.outputs.do_version_bump }}"

  version_bump:
    needs: prerequisite_check
    if: needs.prerequisite_check.outputs.skip != 'true' && needs.prerequisite_check.outputs.branch != '' && needs.prerequisite_check.outputs.do_version_bump == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Set Environment Variables
        run: |
          echo "BRANCH_NAME=${{ needs.prerequisite_check.outputs.branch }}" >> $GITHUB_ENV
          echo "SKIP=${{ needs.prerequisite_check.outputs.skip }}" >> $GITHUB_ENV
          echo "DO_VERSION_BUMP=${{ needs.prerequisite_check.outputs.do_version_bump }}" >> $GITHUB_ENV

      - name: Print Environment Variables
        run: printenv

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_REPO_TOKEN }}
          fetch-depth: 0 # Fetch all history to enable proper commit and push

      - name: Debug Branch Name
        run: |
          echo "Branch to push to: $BRANCH_NAME"

      - name: Get Old App Version
        id: old-app-ver
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Old version: $version"

      - name: Bump Version and Push Changes Back
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"
          npm version patch -m "${{ env.BUMP_VERSION_COMMIT_MSG }} from ${{ steps.old-app-ver.outputs.version }} to %s"
          echo "Pushing to branch: $BRANCH_NAME"
          git push origin HEAD:"$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REPO_TOKEN }}
