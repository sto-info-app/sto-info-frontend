name: Version bump on PR open (to development branch)

on:
  pull_request:
    branches: [development]
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: read

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump_version:
    runs-on: ubuntu-latest

    steps:
      - name: Detect fork PR
        id: fork-check
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            echo "PR is from a fork. Skipping version bump."
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head branch
        if: steps.fork-check.outputs.is_fork != 'true'
        uses: actions/checkout@v4
        with:
          # Checkout the PR source branch, not the base branch
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Node
        if: steps.fork-check.outputs.is_fork != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Stop if already bumped on this branch
        if: steps.fork-check.outputs.is_fork != 'true'
        run: |
          if git log -50 --pretty=%s | grep -qi "^chore: bump version to"; then
            echo "Version bump commit already present. Exiting."
            exit 0
          fi

      - name: Show current version
        if: steps.fork-check.outputs.is_fork != 'true'
        run: node -p "require('./package.json').version"

      - name: Bump patch version (commit to PR branch)
        if: steps.fork-check.outputs.is_fork != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump package.json/package-lock.json and create a commit.
          # No git tag is created.
          npm version patch --no-git-tag-version -m "chore: bump version to %s"

          git push origin HEAD:${{ github.event.pull_request.head.ref }}
