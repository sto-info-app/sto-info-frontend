name: CI/CD

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'development'

env:
  NODE_VERSION: 18
  BUMP_VERSION_COMMIT_MSG: 'Bump version number'

jobs:
  prerequisite_check:
    runs-on: ubuntu-latest

    # Check commit message
    outputs:
      skip: ${{ steps.commit.outputs.skip }}
      branch: ${{ steps.get-branch-name.outputs.branch }}
      angular_version: ${{ steps.get-angular-version.outputs.angular_version }}
    steps:
      - name: Output GitHub variables
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Base Ref: ${{ github.event.pull_request.base.ref }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - id: commit
        name: Get commit message
        run: |
          COMMIT_MESSAGE=$(git log --no-merges -1 --format=%B)
          echo "Current commit message: $COMMIT_MESSAGE"
          if [[ "$COMMIT_MESSAGE" == *"${{ env.BUMP_VERSION_COMMIT_MSG }}"* ]]; then
            echo "::set-output name=skip::true"
          else
            echo "::set-output name=skip::false"
          fi
        shell: bash

      - id: get-angular-version
        name: Get Angular version
        run: |
          angular_version=$(node -p "require('./package.json').version")
          echo "Angular version is: $angular_version"
          echo "::set-output name=angular_version::$angular_version"
        shell: bash

      - id: get-branch-name
        name: Get branch name
        run: |
          branch_name=$(echo ${GITHUB_HEAD_REF})
          echo "Branch name is: $branch_name"
          echo "::set-output name=branch::$branch_name"
        shell: bash

  test:
    needs: prerequisite_check
    if: needs.prerequisite_check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT_REPO_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && needs.prerequisite_check.outputs.branch || 'master' }}
          fetch-depth: 0 # Fetch all history to enable proper commit and push

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}
          fontawesome-npm-auth-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

  version_bump:
    needs: [prerequisite_check, test]
    if: needs.prerequisite_check.outputs.skip != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT_REPO_TOKEN }}
          # ref: ${{ github.event_name == 'pull_request' && needs.prerequisite_check.outputs.branch || 'master' }}
          fetch-depth: 0 # Fetch all history to enable proper commit and push

      - name: Bump Version and Push Changes Back (Only for pull requests)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"
          npm version patch -m "${{ env.BUMP_VERSION_COMMIT_MSG }}"
          git push origin HEAD:${{ needs.prerequisite_check.outputs.branch }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REPO_TOKEN }}

  build_and_deploy:
    needs: [prerequisite_check, version_bump]
    if: needs.prerequisite_check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Output GitHub variables
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Base Ref: ${{ github.event.pull_request.base.ref }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Prerequisite Branch: ${{ needs.prerequisite_check.outputs.branch }}"
          echo "Event Name: ${{ github.event_name }}"

      - id: get-angular-version
        name: Get Angular version
        run: |
          angular_version=$(node -p "require('./package.json').version")
          echo "Angular version is: $angular_version"
          echo "::set-output name=angular_version::$angular_version"
        shell: bash

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT_REPO_TOKEN }}
          ref: ${{ needs.prerequisite_check.outputs.branch }}
          fetch-depth: 0 # Fetch all history to enable proper commit and push

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}
          fontawesome-npm-auth-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies

      - name: Build Angular Project
        run: npm run build

      - name: Deploy to S3 (Development)
        if: github.event.pull_request.base.ref == 'development_disable'
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: dev.startrekonline.info
          AWS_REGION: eu-west-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SOURCE_DIR: dist/sto-info-frontend/

      - name: Deploy to S3 (Production)
        if: github.event.pull_request.base.ref == 'master'
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks --delete
          path: dist/sto-info-frontend/
          bucket: startrekonline.info
          region: eu-west-2
          access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
