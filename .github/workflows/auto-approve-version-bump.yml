name: Auto-approve version bump PRs

on:
  pull_request:
    types: [opened, synchronize]
    branches: [development]

permissions:
  pull-requests: write

jobs:
  auto_approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Only run for PRs created by github-actions bot with version bump title
    if: >
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.title, 'chore: bump version to')

    steps:
      - name: Auto-approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --approve \
            --body "Auto-approving automated version bump PR"
