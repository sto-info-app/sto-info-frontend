name: Lint and Test

on:
  pull_request:
    branches:
      - development
      - 'epic/*'
      - production
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - development
      - production

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_test:
    # Don't run for draft PRs (but still run for pushes)
    # Skip version bump PRs from github-actions bot or with version bump branch pattern
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !(github.event_name == 'pull_request' && (
        (github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.event.pull_request.title, 'chore: bump version to')) ||
        startsWith(github.event.pull_request.head.ref, 'chore/bump-version-to-')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: ${{ steps.cache-toggle.outputs.use_cache }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Create test environment.ts
        run: |
          mkdir -p src/environments
          cat << 'EOF' > src/environments/environment.ts
          import packageJson from '../../package.json';
          import type { Environment } from './models/environment.model';

          export const environment: Environment = {
            production: false,
            version: packageJson.version,
            env_name: 'ci',
            env_label: 'CI',
            apiUrl: 'http://localhost:3000',
            appTitle: 'STO Info (CI)',
            appLoggedInHome: '/dashboard',
            allowDebugging: false,
            minsBeforeLogoutExpiryToShowWarning: 5,
            minsBeforeLogoutExpiryToRefreshToken: 2,
            cookieYesUrl: 'https://cdn-cookieyes.com/client_data/test/script.js',
            gaMeasurementId: 'G-XXXXXXX',
            logRocketAppId: 'test/appid',
          };
          EOF

      - name: Run Linter
        run: npm run lint

      - name: Run Tests (with coverage)
        run: npm run test:cov

      - name: Verify coverage exists
        run: test -f reports/coverage/lcov.info

      - name: SonarQube Cloud Scan
        # Skip on fork PRs (e.g. Dependabot); secrets like SONAR_TOKEN are not available there
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties
            -Dsonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,**/*.spec.ts,**/*.test.ts
            -Dsonar.coverage.exclusions=src/main.ts,src/test.ts,src/polyfills.ts,src/environments/**,src/**/index.ts,src/**/index.js,src/environments/inject-env-vars.js,**/*.module.ts,**/*.constants.ts
            -Dsonar.issue.ignore.multicriteria=e1,e2
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1313
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts,**/*.test.ts,**/__tests__/**,**/test/**,**/tests/**
            -Dsonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6684
            -Dsonar.issue.ignore.multicriteria.e2.resourceKey=**/*.spec.ts,**/*.test.ts,**/__tests__/**,**/test/**,**/tests/**

      - name: Restore Stryker incremental cache
        # Only run on PRs
        if: github.event_name == 'pull_request'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.base_ref }}-${{ hashFiles('src/**/*.ts', '!src/**/*.spec.ts') }}
          restore-keys: |
            stryker-incremental-${{ github.base_ref }}-
            stryker-incremental-

      - name: Run Incremental Mutation Testing
        # Only run on PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # Fetch the base branch to compare against
          git fetch origin ${{ github.base_ref }} --depth=1

          # Get changed files in src/ that match mutation criteria (exclude specs, modules, static pages, etc.)
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | \
            grep '^src/.*\.ts$' | \
            grep -v '\.d\.ts$' | \
            grep -v '\.spec\.ts$' | \
            grep -v '\.module\.ts$' | \
            grep -v 'environments/' | \
            grep -v '\.model\.ts$' | \
            grep -v '\.models\.ts$' | \
            grep -v '\.interface\.ts$' | \
            grep -v '\.interfaces\.ts$' | \
            grep -v '\.enum\.ts$' | \
            grep -v '\.constant\.ts$' | \
            grep -v '\.constants\.ts$' | \
            grep -v 'main.ts' | \
            grep -v 'static-pages/' | \
            grep -v 'shared/components/lcars-' | \
            grep -v 'template/footer' | \
            tr '\n' ',' | sed 's/,$//' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant source files changed. Skipping mutation testing."
          else
            echo "Mutating files: $CHANGED_FILES"
            # Run with incremental mode and limited concurrency
            npx stryker run \
              --mutate "$CHANGED_FILES" \
              --concurrency 2 \
              --incremental \
              --force
          fi

      - name: Build (push only)
        if: github.event_name == 'push'
        run: npm run build
