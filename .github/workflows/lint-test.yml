name: Lint and Test

on:
  pull_request:
    branches:
      - development
      - 'epic/*'
      - production
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - development
      - production

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependabot_note:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment on Dependabot PR (private dependencies)
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const commentLines = [
              "### CI skipped for Dependabot PRs",
              "",
              "This repository uses **private npm dependencies** (e.g. Font Awesome Pro)",
              "which require secrets that are **not available to Dependabot workflows**.",
              "",
              "For this reason:",
              "- Dependency installation, linting, tests, and builds are intentionally **skipped**",
              "- Dependency security is still covered by **Dependabot alerts**",
              "- Full CI runs for all human-authored PRs",
              "",
              "This behaviour is intentional and documented to avoid misleading CI failures."
            ];

            const commentBody = commentLines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            const alreadyCommented = comments.some(c =>
              c.body.includes("CI skipped for Dependabot PRs")
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody
              });
            }

  lint_and_test:
    # Don't run for draft PRs (but still run for pushes)
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}
          fontawesome-npm-auth-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: ${{ steps.cache-toggle.outputs.use_cache }}
          node-version: ${{ env.NODE_VERSION }}
          fontawesome-npm-auth-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Create test environment.ts
        run: |
          mkdir -p src/environments
          cat << 'EOF' > src/environments/environment.ts
          import packageJson from '../../package.json';
          import type { Environment } from './models/environment.model';

          export const environment: Environment = {
            production: false,
            version: packageJson.version,
            env_name: 'ci',
            env_label: 'CI',
            apiUrl: 'http://localhost:3000',
            appTitle: 'STO Info (CI)',
            appLoggedInHome: '/dashboard',
            allowDebugging: false,
            minsBeforeLogoutExpiryToShowWarning: 5,
            minsBeforeLogoutExpiryToRefreshToken: 2,
            cookieYesUrl: 'https://cdn-cookieyes.com/client_data/test/script.js',
            gaMeasurementId: 'G-XXXXXXX',
            logRocketAppId: 'test/appid',
          };
          EOF

      - name: Run Linter
        run: npm run lint

      - name: Run Tests (with coverage)
        run: npm run test:ci

      - name: Run Incremental Mutation Testing
        # Only run on PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # Fetch the base branch to compare against
          git fetch origin ${{ github.base_ref }} --depth=1

          # Get changed files in src/ that match mutation criteria (exclude specs, modules, etc.)
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | \
            grep '^src/.*\.ts$' | \
            grep -v '\.spec\.ts$' | \
            grep -v '\.module\.ts$' | \
            grep -v 'environments/' | \
            grep -v '\.model\.ts$' | \
            grep -v '\.models\.ts$' | \
            grep -v '\.interface\.ts$' | \
            grep -v '\.interfaces\.ts$' | \
            grep -v '\.enum\.ts$' | \
            grep -v '\.constant\.ts$' | \
            grep -v '\.constants\.ts$' | \
            grep -v 'main.ts' | \
            grep -v 'test.ts' | \
            grep -v 'test-setup.ts' | \
            tr '\n' ',' | sed 's/,$//')

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant source files changed. Skipping mutation testing."
          else
            echo "Mutating files: $CHANGED_FILES"
            npx stryker run --mutate "$CHANGED_FILES"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        # Skip analysis for draft PRs and PRs from forks where secrets are unavailable
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.draft == false &&
           github.event.pull_request.head.repo.full_name == github.repository)

      - name: Build (push only)
        if: github.event_name == 'push'
        run: npm run build
