name: Lint and Test

on:
  workflow_dispatch:

    #TODO: Enable after workflow testing is complete!
  # pull_request:
  #   types: [opened, synchronize, edited, reopened]
  #   branches:
  #     - 'master'
  #     - 'development'
  #     - 'epic/*'

env:
  NODE_VERSION: 22

jobs:
  prerequisite_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check if NODE_VERSION exists
        run: echo "NODE_VERSION=$NODE_VERSION"
        if: env.NODE_VERSION

  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}
          fontawesome-npm-auth-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test
