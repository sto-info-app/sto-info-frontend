name: Bug Report
description: Report a bug to help us improve.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behaviour
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the application is affected?
      options:
        - UI / UX
        - Auth / Account
        - Forms / Data Entry
        - Accessibility
        - Performance
        - Build / Tooling
        - Other
    validations:
      required: true
  - type: input
    id: browser-details
    attributes:
      label: Browser / Device
      description: e.g. Chrome on Windows 11, Safari on iOS.
    validations:
      required: true
  - type: textarea
    id: console-errors
    attributes:
      label: Console Errors
      description: Paste any error logs from the browser console (if applicable).
  - type: checkboxes
    id: safeguards
    attributes:
      label: Safeguards
      options:
        - label: I confirm that I have not included any secrets or PII (Personally Identifiable Information) in logs or screenshots.
          required: true
