name: 'Get & Cache Dependencies'
description: 'Get the dependencies (via npm) and cache them.'

inputs:
  use-cache:
    description: 'Set to false to skip restoring/saving the node_modules cache.'
    required: false
    default: 'true'
  node-version:
    description: 'Node.js version (for cache key purposes).'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Restore node_modules cache
      if: inputs.use-cache == 'true'
      id: node-modules-cache
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node${{ inputs['node-version'] }}-node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: inputs.use-cache != 'true' || steps.node-modules-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - name: Save node_modules cache
      if: inputs.use-cache == 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node${{ inputs['node-version'] }}-node-modules-${{ hashFiles('package-lock.json') }}

    - name: Using cached node_modules
      if: inputs.use-cache == 'true' && steps.node-modules-cache.outputs.cache-hit == 'true'
      run: echo "Using cached node_modules"
      shell: bash

    - name: Skipping cache usage
      if: inputs.use-cache != 'true'
      run: echo "Cache disabled via use-cache input"
      shell: bash
