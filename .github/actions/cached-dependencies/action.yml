name: Cached dependencies
description: Restore and cache node_modules, then install dependencies

inputs:
  use-cache:
    description: 'Whether to use node_modules cache'
    required: true
  node-version:
    description: 'Node.js major version (used in cache key)'
    required: true
  fontawesome-npm-auth-token:
    description: 'Font Awesome npm auth token'
    required: true

runs:
  using: composite
  steps:
    - name: Configure npm auth (project .npmrc)
      shell: bash
      run: |
        printf "%s\n" \
          "@fortawesome:registry=https://npm.fontawesome.com/" \
          "//npm.fontawesome.com/:_authToken=${{ inputs.fontawesome-npm-auth-token }}" \
          > .npmrc

    - name: Restore node_modules cache
      if: inputs.use-cache == 'true'
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: node_modules
        key: ${{ runner.os }}-node${{ inputs.node-version }}-node-modules-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node${{ inputs.node-version }}-node-modules-

    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Clean up npm auth
      shell: bash
      run: rm -f .npmrc
