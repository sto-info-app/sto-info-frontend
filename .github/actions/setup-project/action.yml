name: 'Setup Project'
description: 'Set up Node.js'

inputs:
  node-version:
    description: 'Node.js version'
    required: true
    default: '24.22.1'

runs:
  using: 'composite'

  steps:
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
