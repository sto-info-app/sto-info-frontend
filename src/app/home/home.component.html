<div>
  <h1>Welcome to the {{ appTitle }}!</h1>
  <p>
    This is a work in progress!
    <fa-icon [icon]="['fas', 'hand-spock']"></fa-icon>
  </p>
  @if (!isLoggedIn) {
  <div class="buttons">
    <a
      [routerLink]="getRouteLink(appRoutes.LOGIN)"
      class="bluey"
      >Login</a
    >
    <a
      [routerLink]="getRouteLink(appRoutes.REGISTER)"
      class="sunflower"
      >Register</a
    >
  </div>
  }
</div>
