<section class="collapsible-section">
  <div
    class="lcars-text-bar"
    [ngClass]="barClass">
    <h2 class="collapsible-section__title">
      <span>{{ heading }}</span>
    </h2>
    <!--
      The caret shares the bar's actions group with whatever the host projects
      beside it - an edit pen, say - so a bar with the caret alone and a bar
      with two controls read as the same shape.
    -->
    <div class="lcars-bar-actions">
      <ng-content select="[sectionActions]" />
      <button
        type="button"
        class="cta-icon"
        [attr.aria-expanded]="isExpanded"
        [attr.aria-controls]="contentId"
        [title]="isExpanded ? 'Collapse' : 'Expand'"
        (click)="toggle()">
        <i
          class="fas"
          [class.fa-caret-up]="isExpanded"
          [class.fa-caret-down]="!isExpanded"
          aria-hidden="true"></i>
      </button>
    </div>
  </div>

  @if (isExpanded) {
    <div
      class="collapsible-section__content"
      [id]="contentId">
      <ng-content />
    </div>
  }
</section>
