<!--
  Named by its heading alone, not the badge beside it, so every section is a
  region a screen reader and a test can find by that name.
-->
<section
  class="collapsible-section"
  [attr.aria-labelledby]="headingId">
  <div
    class="lcars-text-bar"
    [ngClass]="barClass">
    <h2 class="collapsible-section__title">
      @if (badge === null) {
        <span [id]="headingId">{{ heading }}</span>
      } @else {
        <span class="title-with-badge">
          <span [id]="headingId">{{ heading }}</span>
          <span class="sr-only">, </span>
          <span class="header-count-badge">{{ badge }}</span>
        </span>
      }
    </h2>
    <!--
      The caret shares the bar's actions group with whatever the host projects
      beside it - an edit pen, say - so a bar with the caret alone and a bar
      with two controls read as the same shape.
    -->
    <div class="lcars-bar-actions">
      <ng-content select="[sectionActions]" />
      <button
        type="button"
        class="cta-icon"
        [attr.aria-expanded]="isExpanded"
        [attr.aria-controls]="contentId"
        [title]="isExpanded ? 'Collapse' : 'Expand'"
        (click)="toggle()">
        <i
          class="fas"
          [class.fa-caret-up]="isExpanded"
          [class.fa-caret-down]="!isExpanded"
          aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!--
    Hidden rather than removed, so a form inside keeps what was typed into it
    while its section is folded away.
  -->
  <div
    class="collapsible-section__content"
    [id]="contentId"
    [hidden]="!isExpanded">
    <ng-content />
  </div>
</section>
