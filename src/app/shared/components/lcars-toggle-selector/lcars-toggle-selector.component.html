<div
  class="lcars-toggle-selector"
  [class.lcars-toggle-selector--disabled]="disabled"
  [attr.aria-label]="ariaLabel"
  role="group">
  <button
    type="button"
    class="lcars-toggle-selector__seg lcars-toggle-selector__seg--off"
    [class.lcars-toggle-selector__seg--active]="!checked"
    [disabled]="disabled || null"
    aria-pressed="false"
    [attr.aria-pressed]="!checked ? 'true' : 'false'"
    (click)="select(false)">
    {{ offLabel }}
  </button>
  <button
    type="button"
    class="lcars-toggle-selector__seg lcars-toggle-selector__seg--on"
    [class.lcars-toggle-selector__seg--active]="checked"
    [disabled]="disabled || null"
    aria-pressed="false"
    [attr.aria-pressed]="checked ? 'true' : 'false'"
    (click)="select(true)">
    {{ onLabel }}
  </button>
</div>
