<section
  class="lcars-panel"
  [attr.aria-labelledby]="headingId">
  <div class="lcars-panel__heading">
    @switch (level()) {
      @case (2) {
        <h2
          class="lcars-panel__name"
          [id]="headingId">
          {{ heading() }}
        </h2>
      }
      @case (4) {
        <h4
          class="lcars-panel__name"
          [id]="headingId">
          {{ heading() }}
        </h4>
      }
      @default {
        <h3
          class="lcars-panel__name"
          [id]="headingId">
          {{ heading() }}
        </h3>
      }
    }
    <div class="lcars-panel__marks">
      <ng-content select="[panelMarks]" />
    </div>
    @if (collapsible()) {
      <button
        type="button"
        class="lcars-panel__toggle"
        [attr.aria-expanded]="isExpanded()"
        [attr.aria-controls]="bodyId"
        [title]="isExpanded() ? 'Collapse' : 'Expand'"
        (click)="toggle()">
        <i
          class="fas"
          [class.fa-caret-up]="isExpanded()"
          [class.fa-caret-down]="!isExpanded()"
          aria-hidden="true"></i>
      </button>
    }
  </div>
  <!--
    Hidden rather than removed, so a search part way through keeps what was
    typed into it while its panel is folded away.
  -->
  <div
    class="lcars-panel__body"
    [id]="bodyId"
    [hidden]="!isExpanded()">
    <ng-content />
  </div>
</section>
