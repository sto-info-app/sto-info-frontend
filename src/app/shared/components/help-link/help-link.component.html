<!--
  Drawn as an LCARS numbered panel button: a rounded cap, a large question mark where the panel's number would
  stand, and the words on a pill. The mark is hidden from assistive
  technology, so the link is named by its words alone.
-->
<a
  class="help-link"
  [routerLink]="path()"
  ><span
    class="help-link__cap"
    aria-hidden="true"></span
  ><span
    class="help-link__mark"
    aria-hidden="true"
    >?</span
  ><span class="help-link__label">{{ label() }}</span></a
>
