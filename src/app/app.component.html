<div class="wrap-everything">
  <section id="column-3">
    <div class="wrap">
      <div
        #scrollTopButton
        class="scroll-top">
        <a
          (click)="scrollToTop()"
          id="scroll-top"
          ><span class="hop">screen</span> top</a
        >
      </div>
      <div class="left-frame-top">
        <div class="panel panel-1">
          <a
            *ngIf="!isLoggedIn"
            [routerLink]="getRouteLink(appRoutes.LOGIN)"
            routerLinkActive="peach"
            >Login</a
          >
          <a
            *ngIf="isLoggedIn"
            (click)="logout()"
            >Logout</a
          >
        </div>
        <div
          class="panel panel-2"
          [innerHTML]="sideColumnRandomTextItems[0]"></div>
      </div>
      <div class="right-frame-top">
        <div class="banner">{{ appTitle }}</div>
        <div class="data-cascade-button-group">
          <div class="cascade-wrapper">
            <div
              class="data-cascade"
              id="default">
              <div [innerHTML]="dataCascade"></div>
            </div>
          </div>
          <nav id="nav-standard">
            <a
              [routerLink]="getRouteLink('HOME')"
              [routerLinkActiveOptions]="{ exact: true }"
              routerLinkActive="almond-creme"
              id="b-one"
              >Home</a
            >
            <a
              [routerLink]="getRouteLink(appRoutes.ABOUT)"
              routerLinkActive="almond-creme"
              id="b-two"
              >About</a
            >
            <a
              [routerLink]="getRouteLink(appRoutes.STO_DASHBOARD)"
              routerLinkActive="almond-creme"
              id="b-three"
              >Dashboard</a
            >
            <a
              [routerLink]="getRouteLink(appRoutes.CONTACT)"
              routerLinkActive="almond-creme"
              id="b-four"
              >Contact</a
            >
          </nav>
        </div>
        <div class="bar-panel first-bar-panel">
          <div class="bar-1"></div>
          <div class="bar-2"></div>
          <div class="bar-3"></div>
          <div class="bar-4"></div>
          <div class="bar-5"></div>
        </div>
      </div>
    </div>
    <div
      class="wrap lcars-main-content-container"
      id="gap">
      <div class="left-frame">
        <div class="panel-grow-container">
          <div class="panel panel-3"></div>
          <div class="sidebar-buttons">
            <a
              *ngIf="!isLoggedIn"
              [routerLink]="getRouteLink(appRoutes.REGISTER)"
              routerLinkActive="peach"
              >Register</a
            >
            <a
              *ngIf="isLoggedIn"
              [routerLink]="getRouteLink(appRoutes.STO_DASHBOARD)"
              routerLinkActive="peach"
              >Dashboard</a
            >
          </div>
          <div class="panel panel-4"></div>
          <div class="panel panel-5"></div>
          <div
            class="panel panel-6"
            [innerHTML]="sideColumnRandomTextItems[1]"></div>
          <!-- <div class="panel panel-7"></div> -->
          <!-- <div class="panel panel-8"></div> -->
          <div class="panel panel-9"></div>
          <!-- <div class="panel panel-10"></div> -->
        </div>
      </div>
      <div class="right-frame">
        <div class="bar-panel">
          <div class="bar-6"></div>
          <div class="bar-7"></div>
          <div class="bar-8"></div>
          <div class="bar-9"></div>
          <div class="bar-10"></div>
        </div>
        <main>
          <router-outlet></router-outlet>
        </main>

        <footer>
          <div class="footer-inside">
            <div class="footer-text">
              <p>Copyright &#169; {{ currentYear }} {{ appTitle }}.</p>
              <p>
                LCARS Inspired Website Template by Jim Robertus
                <a
                  target="_blank"
                  href="https://www.thelcars.com"
                  >www.TheLCARS.com</a
                >. Using
                <a
                  target="_blank"
                  href="https://icons8.com/icons/set/star-trek"
                  >Star Trek icons</a
                >
                provided by
                <a
                  target="_blank"
                  href="https://icons8.com"
                  >Icons8</a
                >.
              </p>
            </div>
          </div>
          <div class="footer-panel">v{{ appVersion }}</div>
        </footer>
      </div>
    </div>
  </section>
</div>
