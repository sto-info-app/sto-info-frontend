<div
  class="wrap gap"
  id="lcars-body-container">
  <app-side-bar [isLoggedIn]="isLoggedIn"></app-side-bar>

  <div class="right-frame">
    <app-main-content-bar-panel></app-main-content-bar-panel>
    <main>
      <router-outlet></router-outlet>
    </main>

    <footer>
      <div
        id="footer-inside"
        aria-live="polite">
        <div id="footer-text">
          @defer (on viewport) {
            <app-footer></app-footer>
          } @placeholder {
            <span>Loading footer…</span>
          }
        </div>
      </div>
      <div id="footer-panel-container">
        <div id="footer-panel">
          @if (backendAppVersion) {
            FV-{{ frontendAppVersion }}
          }
          @if (frontendAppVersion && backendAppVersion) {
            <br />
          }
          @if (backendAppVersion) {
            BV-{{ backendAppVersion }}
          }
        </div>
      </div>
    </footer>
  </div>
</div>
