@if (isVisible && state) {
  <div class="storytime-follow">
    @if (errorMessage) {
      <p
        class="storytime-follow__error"
        role="alert">
        {{ errorMessage }}
      </p>
    }

    <button
      type="button"
      class="lcars-btn lcars-btn-auto storytime-follow__button"
      [class.green]="state.isFollowing"
      [class.sky]="!state.isFollowing"
      [attr.aria-pressed]="state.isFollowing"
      [disabled]="isSaving"
      (click)="toggle()">
      <i
        class="fa-solid fa-user-plus"
        aria-hidden="true"></i>
      {{ state.isFollowing ? 'Following ' + label : 'Follow ' + label }}
      <span class="storytime-follow__count">
        {{ state.followerCount }}
        <span class="sr-only">{{
          state.followerCount === 1 ? 'follower' : 'followers'
        }}</span>
      </span>
    </button>
  </div>
}
