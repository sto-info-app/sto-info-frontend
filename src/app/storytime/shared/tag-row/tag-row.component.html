@if (tags.length > 0) {
  <div class="storytime-tag-row">
    <span class="storytime-tag-row__icon">
      <i
        class="fa-solid fa-tags"
        aria-hidden="true"></i>
    </span>
    <ul
      class="storytime-tag-row__list"
      aria-label="Tags">
      @for (tag of tags; track tag.id) {
        <li
          class="storytime-tag-row__tag"
          [title]="tag.description ?? tag.name">
          {{ tag.name }}
        </li>
      }
    </ul>
  </div>
}
