<details class="storytime-setting-help">
  <summary
    class="storytime-setting-help__trigger"
    [attr.aria-label]='label + " details"'
  >
    <i
      class="fas fa-question-circle"
      aria-hidden="true"
    ></i>
  </summary>
  <div
    class="storytime-setting-help__popup"
    [class.storytime-setting-help__popup--wide]="wide"
  >
    @for (option of options; track option.value) {
      @if (option.description) {
        <p>
          <strong>{{ option.label }}</strong>
          <span>{{ option.description }}</span>
        </p>
      }
    }
    <ng-content />
  </div>
</details>
