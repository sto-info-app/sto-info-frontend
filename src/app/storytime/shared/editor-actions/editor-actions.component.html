<div class="storytime-form-actions">
  <button
    class="lcars-btn green"
    type="submit"
    [attr.form]="formId || null"
    [disabled]="isSaving">
    {{ isSaving ? 'Saving…' : 'Save' }}
  </button>

  @if (canPublish) {
    <button
      class="lcars-btn green"
      type="button"
      [disabled]="isSaving"
      (click)="publish.emit()">
      Save and publish
    </button>
  }

  <a
    class="lcars-btn"
    [routerLink]="cancelLink"
    >Cancel</a
  >
</div>
