<section
  id="storytime-removed-content-page"
  class="storytime-page">
  <div class="lcars-text-bar small-lcars-bar-gap">
    <span>Removed</span>
  </div>

  <h1>This has been removed</h1>

  <p class="storytime-removed__summary">
    An administrator has taken this down for breaching the content policy. It is
    not lost — whoever wrote it can still see it, and has been told why.
  </p>

  <nav class="storytime-removed__actions">
    <a
      class="lcars-btn bluey"
      [routerLink]="['/', appRoutes.STORYTIME, 'stories']"
      >Browse Stories</a
    >
    <a
      class="lcars-btn sunflower"
      [routerLink]="['/', appRoutes.STORYTIME, 'content-policy']"
      >Read the content policy</a
    >
  </nav>
</section>
