<figure class="storytime-media storytime-panel-card storytime-panel-card--video">
  <!--
    The bar names the video the way every other panel in the feature names what
    it holds, and it is the figure's caption because that is what it is: the
    thing a reader is told this picture is.
  -->
  <figcaption class="storytime-panel-card__heading">
    <span class="storytime-panel-card__name">{{ panelName }}</span>
  </figcaption>

  <div class="storytime-panel-card__body">
    @if (isPlaying) {
      <iframe
        class="storytime-media__player"
        [src]="embedSource"
        [title]="label"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    } @else {
      <button
        type="button"
        class="storytime-media__poster"
        (click)="play()">
        <img
          class="storytime-media__thumbnail"
          [src]="thumbnailSource"
          (error)="onThumbnailMissing()"
          alt=""
          loading="lazy" />
        <span
          class="storytime-media__play"
          aria-hidden="true">
          <i class="fa-solid fa-play"></i>
        </span>
        <span class="sr-only">Play {{ label }}</span>
      </button>
    }

    @if (media.caption) {
      <p class="storytime-media__notes">{{ media.caption }}</p>
    }
  </div>
</figure>
