<span class="custom-tracking-reorder-controls">
  <button
    class="cta-icon"
    type="button"
    [title]="earlierLabel"
    [attr.aria-label]="earlierLabel"
    [disabled]="isFirst"
    (click)="moveUp.emit()">
    <i
      class="fa-solid"
      [class.fa-caret-up]="!isHorizontal"
      [class.fa-caret-left]="isHorizontal"
      aria-hidden="true"></i>
  </button>

  <button
    class="cta-icon"
    type="button"
    [title]="laterLabel"
    [attr.aria-label]="laterLabel"
    [disabled]="isLast"
    (click)="moveDown.emit()">
    <i
      class="fa-solid"
      [class.fa-caret-down]="!isHorizontal"
      [class.fa-caret-right]="isHorizontal"
      aria-hidden="true"></i>
  </button>
</span>
