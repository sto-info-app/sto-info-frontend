<div class="custom-tracking-panel">
  <div class="custom-tracking-panel-bar">
    <button
      type="button"
      class="custom-tracking-panel-toggle"
      [attr.aria-expanded]="isExpanded"
      [attr.aria-controls]="contentId"
      (click)="toggled.emit()">
      <i
        class="fa-solid"
        [class.fa-caret-down]="isExpanded"
        [class.fa-caret-right]="!isExpanded"
        aria-hidden="true"></i>
      <span class="custom-tracking-panel-name">{{ name }}</span>
      <span class="custom-tracking-count">{{ childSummary }}</span>
    </button>

    @if (publiclyVisible) {
      <span class="custom-tracking-badge">Public</span>
    } @else {
      <span class="custom-tracking-badge muted">Private</span>
    }

    @if (suppressed) {
      <span class="custom-tracking-badge warning">Hidden by a moderator</span>
    }

    <app-custom-tracking-reorder-controls
      [itemName]="name"
      [index]="index"
      [count]="count"
      (moveUp)="moveUp.emit()"
      (moveDown)="moveDown.emit()">
    </app-custom-tracking-reorder-controls>

    <button
      type="button"
      class="cta-icon"
      [title]="'Edit ' + name"
      [attr.aria-label]="'Edit ' + name"
      [disabled]="isSaving"
      (click)="edited.emit()">
      <i
        class="fa-solid fa-pen"
        aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="cta-icon"
      [title]="'Delete ' + name"
      [attr.aria-label]="'Delete ' + name"
      [disabled]="isSaving"
      (click)="removed.emit()">
      <i
        class="fa-solid fa-trash"
        aria-hidden="true"></i>
    </button>
  </div>

  <div
    class="custom-tracking-panel-body"
    [id]="contentId"
    [hidden]="!isExpanded">
    @if (description) {
      <p class="custom-tracking-panel-description">{{ description }}</p>
    }

    <ng-content></ng-content>

    @if (canAddChild) {
      <button
        type="button"
        class="lcars-btn lcars-btn-auto green"
        [disabled]="isSaving"
        (click)="childAdded.emit()">
        Add a {{ childKind }} to {{ name }}
      </button>
    } @else {
      <p
        class="custom-tracking-notice"
        role="status">
        This {{ kind }} already holds as many {{ childKind }}s as it may.
      </p>
    }
  </div>
</div>
