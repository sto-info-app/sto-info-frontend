<div class="lcars-text-bar small-lcars-bar-gap">
  <span>Filters</span>
  <button
    type="button"
    class="cta-icon"
    (click)="filtersCollapsedChange.emit(!filtersCollapsed)"
    [attr.aria-label]='filtersCollapsed ? "Show Filters" : "Hide Filters"'
    [title]='filtersCollapsed ? "Show Filters" : "Hide Filters"'
  >
    <i
      class="fas"
      [class.fa-caret-down]="filtersCollapsed"
      [class.fa-caret-up]="!filtersCollapsed"
    ></i>
  </button>
</div>

@if (!filtersCollapsed) {
  <div class="filter-section">
    <label
      class="sr-only"
      [for]="searchId"
    >{{ searchLabel }}</label>
    <input
      [id]="searchId"
      type="text"
      class="filter-input"
      [placeholder]='searchLabel + "…"'
      [ngModel]="searchText"
      (ngModelChange)="searchTextChange.emit($event)"
    />

    @if (completeCount > 0) {
      <button
        type="button"
        class="full-width-btn-link"
        [class.tangerine]="!hideComplete"
        [class.perano]="hideComplete"
        (click)="hideCompleteChange.emit(!hideComplete)"
      >
        {{ hideComplete ? showCompleteLabel : hideCompleteLabel }}
      </button>
    }

    @if (activeFilterCount > 0) {
      <button
        type="button"
        class="full-width-btn-link clear-filters-btn"
        (click)="clearFilters.emit()"
      >
        Clear Filters
      </button>
    }

    <button
      type="button"
      class="full-width-btn-link perano"
      (click)="refresh.emit()"
    >
      <i class="fas fa-rotate-right"></i> Refresh
    </button>
  </div>
}
