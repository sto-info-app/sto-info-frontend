<div class="form-container">
  <h1>Login</h1>
  <form
    (ngSubmit)="onLogin()"
    class="form">
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required />
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required />
    </div>
    <button
      type="submit"
      class="submit-button">
      Login
    </button>
  </form>
</div>
