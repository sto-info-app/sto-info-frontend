@switch (state.kind) {
  @case ('LOADING') {
    <app-loading-bar [loadingText]="loadingText" />
  }

  @case ('MISSING') {
    <app-lcars-information-message
      title="No such record"
      [message]="missingMessage" />
  }

  @case ('ERROR') {
    <app-lcars-error-message
      title="Transmission failed"
      [message]="state.message" />
  }

  @case ('READY') {
    @if (state.notice) {
      <app-lcars-information-message
        title="About this record"
        [message]="state.notice" />
    }

    <app-fleet-scope-header [vm]="state.header" />

    @if (state.following) {
      <app-fleet-follow [vm]="state.following" />
    }

    @if (state.artwork) {
      <app-fleet-scope-artwork
        [vm]="state.artwork"
        (changed)="changed.emit()" />
    }

    @if (state.description) {
      <div class="lcars-text-bar">
        <span>About</span>
      </div>

      <p class="fleet-scope-view__description">{{ state.description }}</p>
    }
  }
}
