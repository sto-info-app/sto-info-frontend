@if (state$ | async; as state) {
  <app-fleet-scope-view
    loadingText="Reading the Community"
    [state]="state"
    [missingMessage]="missingMessage"
    (changed)="reload()" />

  @if (state.kind === 'READY' && canRegisterChildren) {
    <div class="community-page__actions">
      <a
        class="lcars-btn lcars-btn-auto sky"
        [routerLink]="registerFleetLink">
        Register a Fleet here
      </a>
      <a
        class="lcars-btn lcars-btn-auto sky"
        [routerLink]="registerArmadaLink">
        Register an Armada here
      </a>
    </div>
  }
}
