@if (state$ | async; as state) {
  @if (tabsOf(state); as tabs) {
    <app-fleet-tabs [vm]="tabs" />
  }

  <app-fleet-page-shell
    heading="Investigate"
    helpSlug="roster-history-and-corrections"
    helpLabel="Help with correcting the roster"
    [subject]="subjectOf(state)"
    [isLoading]="state.kind === 'LOADING'"
    loadingText="Reading the Fleet"
    [errorMessage]="messageOf(state)">
    @if (state.kind === 'READY') {
      @if (isReadOnly(state.section)) {
        <p
          class="fleet-report-notice"
          role="note">
          {{ readOnlyNote }}
        </p>
      }
      <app-fleet-action-list [actions]="state.data" />
    }
  </app-fleet-page-shell>
}
