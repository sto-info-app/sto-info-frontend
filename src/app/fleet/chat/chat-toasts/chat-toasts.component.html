<output
  class="chat-toasts"
  aria-live="polite">
  @for (toast of toasts(); track toast.id) {
    <span class="chat-toast">
      <a
        class="chat-toast__link"
        [routerLink]="toast.link"
        (click)="dismiss(toast.id)">
        <i
          class="fas fa-comment"
          aria-hidden="true"></i>
        {{ toast.text }}
      </a>
      <button
        type="button"
        class="chat-toast__close"
        aria-label="Dismiss"
        (click)="dismiss(toast.id)">
        <i
          class="fas fa-xmark"
          aria-hidden="true"></i>
      </button>
    </span>
  }
</output>
