<form
  id="chat-report-dialog"
  (submit)="$event.preventDefault(); send()">
  <div mat-dialog-content>
    <div class="lcars-text-bar">
      <span class="go-october-sunset">Report message</span>
    </div>

    <p class="chat-report-dialog__intro">
      Tell the site admins what is wrong with this message from
      <strong>{{ data.authorName }}</strong
      >. They see it, the twenty messages before it, and your username.
      {{ data.authorName }} is never told, and you won’t be told what happens.
    </p>

    <div class="lcars-select-container sunflower">
      <label
        class="select-label"
        for="chat-report-reason"
        >Reason</label
      >
      <select
        id="chat-report-reason"
        title="Reason"
        [value]="reason()"
        (change)="setReason($any($event.target).value)">
        @for (each of reasons; track each) {
          <option
            [value]="each"
            [selected]="each === reason()">
            {{ reasonLabels[each] }}
          </option>
        }
      </select>
    </div>

    <div class="lcars-input-container perano">
      <label for="chat-report-details">
        What is wrong{{ needsDetails() ? '' : ' (optional)' }}
      </label>
      <textarea
        id="chat-report-details"
        rows="4"
        [attr.maxlength]="detailsMax"
        [attr.required]="needsDetails() ? '' : null"
        [value]="details()"
        (input)="setDetails($any($event.target).value)"></textarea>
    </div>
  </div>

  <div
    class="buttons-container lcars-flex-right"
    mat-dialog-actions>
    <button
      type="button"
      class="lcars-btn red"
      (click)="cancel()">
      Cancel
    </button>
    <button
      type="submit"
      class="lcars-btn green"
      [disabled]="!isValid()">
      Send report
    </button>
  </div>
</form>
