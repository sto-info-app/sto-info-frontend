<form
  id="governance-reason-dialog"
  (submit)="$event.preventDefault(); confirm()">
  <div mat-dialog-content>
    <div class="lcars-text-bar">
      <span class="go-october-sunset">{{ data.title }}</span>
    </div>

    <p>{{ data.message }}</p>

    <div class="lcars-input-container tangerine">
      <label for="governance-reason">
        {{ data.label }}
        @if (data.min && data.min > 1) {
          ({{ data.min }} to {{ data.max }} characters)
        }
      </label>
      <textarea
        id="governance-reason"
        rows="3"
        required
        [attr.maxlength]="data.max"
        [value]="reason()"
        (input)="reason.set($any($event.target).value)"></textarea>
    </div>
  </div>

  <div
    class="buttons-container lcars-flex-right"
    mat-dialog-actions>
    <button
      type="button"
      class="lcars-btn green"
      (click)="cancel()">
      Cancel
    </button>
    <button
      type="submit"
      class="lcars-btn red"
      [disabled]="!isValid()">
      {{ data.confirmText }}
    </button>
  </div>
</form>
