<app-collapsible-section
  [heading]="heading"
  [badge]="
    state.kind === 'READY' && state.results.total > 0
      ? state.results.total
      : null
  ">
  @switch (state.kind) {
    @case ('LOADING') {
      <app-loading-bar [loadingText]="loadingText" />
    }

    @case ('ERROR') {
      <div class="error-container">
        <app-lcars-error-message
          title="Transmission failed"
          [message]="state.message" />
      </div>
    }

    @case ('READY') {
      @if (state.results.cards.length === 0) {
        <p class="lcars-empty-state">{{ emptyMessage }}</p>
      } @else {
        <div class="fleet-directory-results__grid lcars-rotate">
          @for (card of state.results.cards; track card.id) {
            <app-fleet-scope-card [vm]="card" />
          }
        </div>

        @if (totalPages > 1) {
          <div class="lcars-pagination">
            <button
              type="button"
              [disabled]="state.results.page <= 1"
              (click)="pageChange.emit(state.results.page - 1)">
              Previous
            </button>
            <span>Page {{ state.results.page }} of {{ totalPages }}</span>
            <button
              type="button"
              [disabled]="state.results.page >= totalPages"
              (click)="pageChange.emit(state.results.page + 1)">
              Next
            </button>
          </div>
        }
      }
    }
  }
</app-collapsible-section>
