@if (canRegister) {
  <p class="communities-directory__register">
    <a
      class="lcars-btn lcars-btn-auto sky"
      [routerLink]="registerLink">
      Register a Community
    </a>
  </p>
}

<app-fleet-directory-filters
  searchLabel="Community name"
  searchPlaceholder="e.g. United Federation Alliance"
  [search]="search"
  [status]="status"
  [sort]="sort"
  [sortOptions]="sortOptions"
  (searchChange)="onSearch($event)"
  (statusChange)="onStatus($event)"
  (sortChange)="onSort($event)" />

@if (state$ | async; as state) {
  <app-fleet-directory-results
    heading="Fleet Communities"
    loadingText="Scanning Community records"
    [state]="state"
    [emptyMessage]="emptyMessage"
    (pageChange)="onPage($event)" />
}
