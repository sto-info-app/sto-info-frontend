<div id="admin-page">
  <h1>Admin</h1>
  <p>Manage public news, site banners and user notifications.</p>

  <div class="admin-cards">
    <a
      class="admin-card"
      [routerLink]="getRouteLink(appRoutes.ADMIN_NEWS)">
      <h2>News &amp; Release Notes</h2>
      <p>Create, edit and publish public posts.</p>
    </a>
    <a
      class="admin-card"
      [routerLink]="getRouteLink(appRoutes.ADMIN_BANNERS)">
      <h2>Banners</h2>
      <p>Manage site-wide banners and their schedule.</p>
    </a>
    <a
      class="admin-card"
      [routerLink]="getRouteLink(appRoutes.ADMIN_NOTIFICATIONS)">
      <h2>Notifications</h2>
      <p>Send broadcast or per-user inbox notifications.</p>
    </a>
  </div>
</div>
