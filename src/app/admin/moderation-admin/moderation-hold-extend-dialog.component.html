<form
  id="moderation-hold-extend-dialog"
  (submit)="$event.preventDefault(); confirm()">
  <div mat-dialog-content>
    <div class="lcars-text-bar">
      <span class="go-october-sunset">Extend hold</span>
    </div>

    <p>
      Keep the evidence on {{ data.subject }} until a later review. A hold is
      reviewed at least every {{ reviewDays }} days.
    </p>

    <div class="lcars-input-container bluey">
      <label for="hold-review-day">Review on</label>
      <input
        id="hold-review-day"
        type="date"
        required
        [attr.min]="earliest"
        [attr.max]="latest"
        [value]="day()"
        (input)="day.set($any($event.target).value)" />
    </div>

    <div class="lcars-input-container tangerine">
      <label for="hold-extend-reason">Reason</label>
      <textarea
        id="hold-extend-reason"
        rows="3"
        required
        maxlength="500"
        [value]="reason()"
        (input)="reason.set($any($event.target).value)"></textarea>
    </div>
  </div>

  <div
    class="buttons-container lcars-flex-right"
    mat-dialog-actions>
    <button
      type="button"
      class="lcars-btn red"
      (click)="cancel()">
      Cancel
    </button>
    <button
      type="submit"
      class="lcars-btn green"
      [disabled]="!isValid()">
      Extend
    </button>
  </div>
</form>
