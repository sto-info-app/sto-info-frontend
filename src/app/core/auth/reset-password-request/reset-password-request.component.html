<div class="reset-password-container">
  <div class="flexbox">
    <div class="col">
      <div class="form-container">
        <h1>Reset Password</h1>
        @if (!successMessage) {
          <div id="reset-password-form-container">
            <form
              (ngSubmit)="onPasswordReset()"
              class="form">
              <div class="lcars-input-container perano">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  [(ngModel)]="email"
                  [class.errored]="errorMessage ? true : false"
                  (input)="validateInputs()" />
                @if (email.trim() !== '' && !validateEmail(email)) {
                  <div class="field-error">{{ errorTextInvalidEmailFormat }}</div>
                }
              </div>
              <button
                type="submit"
                class="submit-button"
                [disabled]="!inputsValid">
                Login
              </button>
            </form>
          </div>
        }
        @if (successMessage) {
          <div id="password-reset-message-container">
            <app-lcars-information-message
              title="Transmitting..."
              [message]="successMessage"></app-lcars-information-message>
          </div>
        }
      </div>
    </div>
    <div class="col right password-reset-side-col">
      <div class="column-container">
        <div class="lcars-text-bar">
          <span>Auxiliary Controls</span>
        </div>
        <div class="buttons">
          <a
            [routerLink]="getRouteLink(appRoutes.LOGIN)"
            class="full-width-btn-link gold"
            >Login</a
          >
          <a
            [routerLink]="getRouteLink(appRoutes.REGISTER)"
            class="full-width-btn-link sunflower"
            >Register</a
          >
        </div>
      </div>
      @if (errorMessage) {
        <app-lcars-error-message
          title="Transmitting..."
          [message]="errorMessage"></app-lcars-error-message>
      }
    </div>
  </div>
</div>
