<div class="reset-password-container">
  <div class="flexbox">
    <div class="col">
      <div class="form-container">
        <h1>Reset Password</h1>
        <div
          id="reset-password-form-container"
          *ngIf="!successMessage">
          <form
            (ngSubmit)="onPasswordReset()"
            class="form">
            <div class="form-group">
              <label for="email">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="email"
                required
                pattern="EMAIL_PATTERN"
                [class.errored]="errorMessage ? true : false"
                (input)="validateInputs()" />
              <div
                *ngIf="email.trim() !== '' && !validateEmail(email)"
                class="helper-error-text">
                Invalid email format
              </div>
            </div>
            <button
              type="submit"
              class="submit-button"
              [disabled]="!inputsValid">
              Login
            </button>
          </form>
        </div>
        <div
          id="password-reset-message-container"
          *ngIf="successMessage">
          <app-lcars-information-message
            title="Transmitting..."
            [message]="successMessage"></app-lcars-information-message>
        </div>
      </div>
    </div>
    <div class="col right password-reset-side-col">
      <div class="column-container">
        <div class="lcars-text-bar">
          <span>Auxiliary Controls</span>
        </div>
        <div class="buttons">
          <a
            href="/login"
            class="full-width-btn-link gold"
            >Login</a
          >
          <a
            href="/register"
            class="full-width-btn-link sunflower"
            >Register</a
          >
        </div>
      </div>
      <app-lcars-error-message
        *ngIf="errorMessage"
        title="Transmitting..."
        [message]="errorMessage"></app-lcars-error-message>
    </div>
  </div>
</div>
