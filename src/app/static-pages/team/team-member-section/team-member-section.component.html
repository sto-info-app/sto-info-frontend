<div class="lcars-text-bar">
  <h2>
    <span>{{ title }}</span>
  </h2>
</div>
@if (vms.length > 0) {
  <div class="team-grid">
    @for (vm of vms; track vm.member.slug) {
      <a
        class="team-card"
        [routerLink]="vm.link">
        <img
          [src]="vm.thumbnailUrl"
          [alt]="vm.member.name"
          title="Team member photo"
          loading="lazy" />
        <div class="team-card-details">
          <div class="team-card-name">{{ vm.member.name }}</div>
          <div class="team-card-title">{{ vm.member.title }}</div>
        </div>
      </a>
    }
  </div>
} @else {
  <p class="empty-state">{{ emptyMessage }}</p>
}
