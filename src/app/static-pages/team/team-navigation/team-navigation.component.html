<app-collapsible-section
  heading="Navigation"
  barClass="small-lcars-bar-gap">
  <div class="buttons">
    @for (navLink of links; track navLink.link) {
      <a
        [routerLink]="navLink.link"
        class="full-width-btn-link"
        >{{ navLink.label }}</a
      >
    }
  </div>
</app-collapsible-section>
