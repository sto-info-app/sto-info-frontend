<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Star Trek Online Info Portal</title>
    <meta
      name="format-detection"
      content="telephone=no" />
    <meta
      name="format-detection"
      content="date=no" />

    <meta
      name="theme-color"
      content="#000000" />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black" />
    <link
      rel="manifest"
      href="/manifest.webmanifest" />
    <link
      rel="canonical"
      href="https://startrekonline.info/" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/favicon-16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/assets/favicons/favicon-96.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="120x120"
      href="/assets/favicons/favicon-120.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon-180x180.png" />
    <link
      rel="preload"
      href="/media/Antonio-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
    <link
      rel="preload"
      href="/media/Antonio-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
