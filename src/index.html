<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Star Trek Online Info Portal</title>
    <meta
      name="format-detection"
      content="telephone=no" />
    <meta
      name="format-detection"
      content="date=no" />

    <meta
      name="theme-color"
      content="#000000" />
    <meta
      name="mobile-web-app-capable"
      content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;500;600;700&family=Roboto+Condensed:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      rel="manifest"
      href="/manifest.webmanifest" />
    <link
      rel="canonical"
      href="https://startrekonline.info/" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/favicon-16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/assets/favicons/favicon-96.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="120x120"
      href="/assets/favicons/favicon-120.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon-180x180.png" />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
