sonar.projectKey=sto-info-app_sto-info-frontend
sonar.organization=sto-info-app


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=STO Info Frontend
sonar.projectVersion=${env.PROJECT_VERSION}

# Core settings
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/environments/**,**/constants/**,**/reports/**,**/.stryker-tmp/**
sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info

# Never require coverage for these
sonar.coverage.exclusions=\
src/main.ts,\
src/**/*.module.ts,\
src/environments/**,\
src/app/**/constants/**,\
src/**/*.model.ts,\
src/**/*.models.ts,\
src/**/*.interface.ts,\
src/**/*.interfaces.ts,\
src/**/*.enum.ts,\
src/**/*.constant.ts,\
src/**/*.constants.ts,\
src/main.ts,\
src/**/index.ts, \
**/.stryker-tmp/**

# Ignore rules that do not apply to specific generated or test sources
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# S1313: "Using hardcoded IP addresses is security-sensitive"
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts,**/*.test.ts,**/__tests__/**,**/test/**,**/tests/**

# S6684: "Hard-coded passwords are security-sensitive"
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6684
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.spec.ts,**/*.test.ts,**/__tests__/**,**/test/**,**/tests/**

# S4666: The Angular Material base theme is generated from the upstream prebuilt theme.
sonar.issue.ignore.multicriteria.e3.ruleKey=css:S4666
sonar.issue.ignore.multicriteria.e3.resourceKey=src/styles/angular-mat-base.scss

# S8776: Parent selectors in mixins receive their scoping root where they are included.
sonar.issue.ignore.multicriteria.e4.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.e4.resourceKey=src/styles/_lcars-mixins.scss

# S8776: The hover/focus selectors in this feature mixin intentionally scope
# to the selector where the mixin is included.
sonar.issue.ignore.multicriteria.e5.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.e5.resourceKey=src/styles/_storytime.scss
